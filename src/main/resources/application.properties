# Datasource padrão SQLite
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:simulaicaixa.db
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1

# Hibernate ORM JPA
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# JWT / Segurança
mp.jwt.verify.issuer=simulaicaixa
smallrye.jwt.verify.algorithm=RS256
mp.jwt.verify.publickey.location=keys/publicKey.pem
smallrye.jwt.sign.key.location=keys/privateKey.pem
mp.jwt.token.header=Authorization
mp.jwt.token.scheme=Bearer
