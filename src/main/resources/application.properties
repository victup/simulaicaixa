# Datasource padrão SQLite
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:simulaicaixa.db
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=1

# Hibernate ORM JPA
#quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.format-sql=true

# JWT / Segurança
mp.jwt.verify.issuer=simulaicaixa
smallrye.jwt.verify.algorithm=RS256
mp.jwt.verify.publickey.location=keys/publicKey.pem
smallrye.jwt.sign.key.location=keys/privateKey.pem
mp.jwt.token.header=Authorization
mp.jwt.token.scheme=Bearer

# Endpoints públicos
quarkus.http.auth.permission.publico.paths=/auth/login
quarkus.http.auth.permission.publico.policy=permit

# Endpoints protegidos para clientes e admin
quarkus.http.auth.permission.app-user.paths=/simular-investimento,/produtos/*,/investimentos/*,/perfil-risco/*
quarkus.http.auth.permission.app-user.policy=authenticated
quarkus.http.auth.permission.app-user.roles-allowed=cliente,admin

quarkus.http.auth.permission.admin-telemetria.paths=/telemetria
quarkus.http.auth.permission.admin-telemetria.policy=authenticated
quarkus.http.auth.permission.admin-telemetria.roles-allowed=admin